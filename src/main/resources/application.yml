# 创作日期：2026-04-22，作者：leiyangjun — 基础服务默认配置（可按环境拆分 application-*.yml）
server:
  port: 8083
  # 经网关按 /{serviceId}/** 访问时，识别 X-Forwarded-Prefix，使 SpringDoc/Swagger 生成带前缀的文档 URL
  forward-headers-strategy: framework
  # 写入 Nacos 实例元数据键 server.description，供网关 Swagger 门户展示
  description: 菜单，权限用户等管理3

spring:
  application:
    name: peach-common-service
    # peach-common-start：ApiResult 等业务码前缀必填（四位模块编码）
    module-code: COMM
  # 默认本地启动使用 dev；生产等环境请设置环境变量 SPRING_PROFILES_ACTIVE（与 peach-auth-service 一致）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:192.168.99.100:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD:nacos}
        namespace: ${NACOS_NAMESPACE:dev}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        ip: ${NACOS_REGISTER_IP:}
        port: ${NACOS_REGISTER_PORT:${server.port}}
        fail-fast: false

  # ==============================
  # 方案A：关闭读写分离（默认）
  # ==============================
  # 关闭时仅使用 spring.datasource 单数据源，适合本地开发与简单部署。
  # 数据库结构/种子：手动执行 src/main/resources/sql/init_table.sql 后再执行 init_data.sql（本服务未启用 Flyway/Liquibase）
  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.99.100:5432/peach_common?currentSchema=public}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    rw:
      enabled: false
      write:
        url: ${DB_WRITE_URL:jdbc:postgresql://192.168.99.100:5432/peach_common?currentSchema=public}
        username: ${DB_WRITE_USERNAME:postgres}
        password: ${DB_WRITE_PASSWORD:postgres}
        driver-class-name: org.postgresql.Driver
      read:
        url: ${DB_READ_URL:jdbc:postgresql://192.168.99.101:5432/peach_common?currentSchema=public}
        username: ${DB_READ_USERNAME:postgres}
        password: ${DB_READ_PASSWORD:postgres}
        driver-class-name: org.postgresql.Driver

#peach.api.context.enable: true
# ==============================
# 方案B：开启读写分离
# ==============================
# 开启后由 peach-common-start 的 ReadWriteDataSourceAutoConfiguration 接管 dataSource：
# - 写事务 / 非只读事务 -> 写库（write）
# - @Transactional(readOnly = true) -> 读库（read）
# 注意：
# 1) 开启后建议不再依赖 spring.datasource 的 url/username/password 作为主配置来源，统一使用 spring.datasource.rw.*
# 2) 若 read 未单独填写，则默认回退使用 write 配置（便于先灰度启用路由再接入从库）

management:
  endpoints:
    web:
      exposure:
        include: health,info
